# Publish the Alphafox CLI homepage to GitHub Pages.
name: pages

on:
  push:
    branches:
      - main
    paths:
      - docs/index.html
      - docs/favicon.svg
      - docs/logo/**
      - docs/.nojekyll
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir -p _site/logo
          cp docs/index.html docs/favicon.svg docs/.nojekyll _site/
          cp docs/logo/*.svg _site/logo/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
